const pct=s=>Math.round(doneN(s.id)/s.lessons.length*100);
const todayN=()=>{const d=new Date().toDateString();if(S.day.d!==d)S.day={d,n:0};return S.day.n};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('show'),1800)};
const go=p=>{location.hash=p};
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let Q=null;

function tiles(){return SUBJECTS.map(s=>`<button class="tile" data-go="/course/${s.id}" style="--t:${s.tint}"><span class="ti">${s.emoji}</span>${s.name}</button>`).join('')}
function rowFor(s){const p=pct(s);return `<button class="row" data-go="/course/${s.id}"><span class="ti sm" style="--t:${s.tint}">${s.emoji}</span><div class="m"><b>${s.title}</b><small>${s.name} · Level ${s.level}</small><span class="pc">${p}%</span><div class="bar p" style="margin-top:8px"><i style="width:${p}%"></i></div></div></button>`}

function home(){
  const n=todayN();
  let cont=SUBJECTS.filter(s=>pct(s)>0&&pct(s)<100);
  if(cont.length<2)cont=cont.concat(SUBJECTS.filter(s=>pct(s)===0)).slice(0,2);
  return `<div class="top"><div class="hello"><div class="av">🧒</div><div><small>Hi, ${esc(S.name)}! 👋</small><h1>Ready to learn something new?</h1></div></div><div style="display:flex;gap:8px"><button class="star" data-go="/themes" aria-label="Change theme">🎨</button><div class="star">⭐ ${S.stars}</div></div></div>
  <div class="goal"><div><small>Today's Goal</small><b>${Math.min(n,3)}/3 Lessons</b><div class="bar"><i style="width:${Math.min(100,n/3*100)}%"></i></div></div><div class="emo">${n>=3?'🏆':'📖'}</div></div>
  <div class="sec"><h3>Explore by Subject</h3></div><div class="subs">${tiles()}</div>
  <div class="sec"><h3>Continue Learning</h3></div>${cont.slice(0,2).map(rowFor).join('')}`;
}
function explore(){return `<div class="top"><h1>Explore</h1><div class="star">⭐ ${S.stars}</div></div>${SUBJECTS.map(rowFor).join('')}`}
function progress(){
  const lessons=SUBJECTS.reduce((a,s)=>a+doneN(s.id),0);
  return `<div class="top"><h1>Your Progress</h1></div>
  <div class="sum"><div class="raise"><b>⭐ ${S.stars}</b><small>Stars</small></div><div class="raise"><b>${lessons}</b><small>Lessons</small></div><div class="raise"><b>${Object.keys(S.best).length}</b><small>Quizzes</small></div></div>
  ${SUBJECTS.map(s=>`<div class="row" style="cursor:default"><span class="ti sm" style="--t:${s.tint}">${s.emoji}</span><div class="m"><b>${s.name}</b><small>${doneN(s.id)}/${s.lessons.length} lessons${S.best[s.id]!=null?' · Best quiz '+S.best[s.id]+'/'+s.quiz.length:''}</small><div class="bar p" style="margin-top:8px"><i style="width:${pct(s)}%"></i></div></div></div>`).join('')}`;
}
function themes(){
  return `<div class="top"><h1>Themes</h1><div class="star">${THEMES.length} styles</div></div><p style="color:var(--mute);margin:0 0 16px">Pick a look. The whole app changes instantly.</p><div class="tgrid">${THEMES.map(([k,n,d])=>`<button class="tp ${S.theme===k?'sel':''}" data-act="theme" data-t="${k}"><div class="tpv" data-theme="${k}"><div class="mc"><b>Aa</b><span></span></div><div class="mb">Play</div></div><b>${n}</b><small>${d}</small>${S.theme===k?'<span class="chk">✓ Active</span>':''}</button>`).join('')}</div>`;
}
function profile(){
  return `<div class="top"><h1>Profile</h1></div><div class="raise" style="padding:20px">
  <div class="center"><div class="av" style="margin:0 auto 12px;width:90px;height:90px;font-size:50px">🧒</div></div>
  <label for="nm"><small>Your name</small></label><input class="field" id="nm" maxlength="14" value="${esc(S.name)}" style="margin:6px 0 4px">
  <button class="cta" data-act="name">Save name</button><button class="cta alt" data-go="/themes">Change theme</button><button class="cta alt" data-act="reset">Reset progress</button></div>`;
}
function course(id){
  const s=sub(id);if(!s)return home();
  const d=S.done[id]||[],nextI=s.lessons.findIndex((_,i)=>!d.includes(i)),all=nextI<0;
  const deco=s.deco.split(',').map(x=>{const[e,l,t,z]=x.split(':');return `<span class="d" style="left:${l}%;top:${t}%;font-size:${z}px">${e}</span>`}).join('');
  const items=s.lessons.map((l,i)=>{
    const isDone=d.includes(i),locked=!isDone&&i!==nextI,cur=i===nextI;
    return `<button class="les ${isDone?'done':''} ${cur?'cur':''}" ${locked?'disabled':`data-go="/lesson/${id}/${i}"`}><span class="num">${isDone?'✓':i+1}</span><div><b>${esc(l[0])}</b><small>5 min</small></div><span>${isDone?'✅':cur?'▶️':'🔒'}</span></button>`}).join('');
  const q=`<button class="les ${all?'cur':''}" ${all?`data-go="/quiz/${id}"`:'disabled'}><span class="num">?</span><div><b>Final Quiz</b><small>${s.quiz.length} questions${S.best[id]!=null?' · Best '+S.best[id]+'/'+s.quiz.length:''}</small></div><span>${all?'▶️':'🔒'}</span></button>`;
  return `<div class="hero" style="background:linear-gradient(${s.sky[0]},${s.sky[1]})"><button class="back" data-go="/home" aria-label="Back">←</button>${deco}<div class="big">${s.hero}</div></div>
  <div class="raise ccard"><div class="chead"><span class="ti sm" style="--t:${s.tint}">${s.emoji}</span><div><small>${s.name}</small><h2>${s.title}</h2></div><span class="lvl">Level ${s.level}</span></div>
  <p>${esc(s.blurb)}</p><div class="stats"><span>📘 ${s.lessons.length} Lessons</span><span>⏱ ${s.lessons.length*5} mins</span><span>📝 ${s.quiz.length} Quiz</span></div>
  <h4>Lessons</h4>${items}${q}<button class="cta" data-go="${all?'/quiz/'+id:'/lesson/'+id+'/'+nextI}">${all?'Take the Quiz':d.length?'Continue Lesson':'Start Lesson'} →</button></div>`;
}
function lesson(id,i){
  const s=sub(id),l=s&&s.lessons[i];if(!l)return home();
  const d=S.done[id]||[];
  if(!d.includes(i)&&i>d.length){go('/course/'+id);return ''}
  return `<div class="top"><button class="back" style="position:static" data-go="/course/${id}" aria-label="Back">←</button><div class="star">Lesson ${i+1} of ${s.lessons.length}</div></div>
  <div class="raise lesson"><div class="big2">${s.emoji}</div><h2 style="margin-top:8px">${esc(l[0])}</h2><p>${esc(l[1])}</p>
  <button class="cta green" data-act="complete" data-id="${id}" data-i="${i}">${d.includes(i)?'Back to course':'I got it! +10 ⭐'}</button></div>`;
}
function startQuiz(id){const s=sub(id);Q={id,i:0,score:0,picked:-1,items:shuffle(s.quiz).map(r=>{const o=shuffle(r.slice(1));return{q:r[0],o,a:o.indexOf(r[1])}}),end:false}}
function quiz(){
  const s=sub(Q.id),n=Q.items.length;
  if(Q.end)return `<div class="center"><div class="trophy">${Q.score===n?'🏆':Q.score>=n/2?'🎉':'💪'}</div><h1>${Q.score}/${n} correct!</h1><p style="color:var(--mute)">${Q.score===n?'Perfect score!':Q.score>=n/2?'Great job!':'Keep practising, you can do it!'}</p>
  <div class="star" style="display:inline-block">+${Q.score*10} ⭐ earned</div><button class="cta" data-act="retry">Try again</button><button class="cta alt" data-go="/course/${Q.id}">Back to course</button></div>`;
  const q=Q.items[Q.i],last=Q.i===n-1;
  return `<div class="top"><button class="back" style="position:static" data-go="/course/${Q.id}" aria-label="Back">←</button><div class="star">⭐ ${S.stars}</div></div>
  <div class="segs">${Q.items.map((_,k)=>`<i class="${k<Q.i?'on':k===Q.i?'cur':''}"></i>`).join('')}</div><small>Question ${Q.i+1} of ${n}</small>
  <div class="raise qcard"><h2>${esc(q.q)}</h2><span class="qe">${s.emoji}</span></div>
  ${q.o.map((o,k)=>`<button class="opt ${Q.picked<0?'':k===q.a?'right':k===Q.picked?'wrong':''}" data-act="pick" data-k="${k}"><span class="let">${'ABCD'[k]}</span>${esc(o)}</button>`).join('')}
  <button class="cta green" data-act="next" ${Q.picked<0?'disabled':''}>${last?'Finish':'Next Question'} →</button>`;
}
function drawNav(tab){
  const t=[['home','🏠','Home'],['explore','🔍','Explore'],['progress','📊','Progress'],['themes','🎨','Themes'],['profile','👤','Profile']];
  $('#nav').innerHTML=t.map(([k,e,l])=>`<button class="${k===tab?'on':''}" data-go="/${k}"><span>${e}</span>${l}</button>`).join('');
}
function draw(){
  const v=$('#view'),p=(location.hash.slice(1)||'/home').split('/'),r=p[1];
  let html,tab=r;
  if(r==='course'){html=course(p[2]);tab='home'}
  else if(r==='lesson'){html=lesson(p[2],+p[3]);tab='home'}
  else if(r==='quiz'){if(!Q||Q.id!==p[2]||Q.fresh!==location.hash)startQuiz(p[2]);Q.fresh=location.hash;html=quiz();tab='home'}
  else if(r==='explore')html=explore();
  else if(r==='progress')html=progress();
  else if(r==='themes')html=themes();
  else if(r==='profile')html=profile();
  else{html=home();tab='home'}
  v.innerHTML=html;drawNav(tab);if(r!=='quiz')window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#/quiz'))Q=null;draw()});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g&&!g.disabled){go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(!a||a.disabled)return;
  const act=a.dataset.act;
  if(act==='complete'){const id=a.dataset.id,i=+a.dataset.i;S.done[id]=S.done[id]||[];
    if(!S.done[id].includes(i)){S.done[id].push(i);S.stars+=10;todayN();S.day.n++;save();toast('+10 ⭐ Lesson complete!')}go('/course/'+id)}
  else if(act==='pick'){if(Q.picked>=0)return;const k=+a.dataset.k;Q.picked=k;if(k===Q.items[Q.i].a){Q.score++;S.stars+=10;save()}$('#view').innerHTML=quiz()}
  else if(act==='next'){if(Q.i===Q.items.length-1){Q.end=true;const b=S.best[Q.id];if(b==null||Q.score>b)S.best[Q.id]=Q.score;save()}else{Q.i++;Q.picked=-1}$('#view').innerHTML=quiz();window.scrollTo(0,0)}
  else if(act==='retry'){startQuiz(Q.id);Q.fresh=location.hash;$('#view').innerHTML=quiz();window.scrollTo(0,0)}
  else if(act==='name'){S.name=($('#nm').value.trim()||'Explorer').slice(0,14);save();toast('Name saved');draw()}
  else if(act==='theme'){S.theme=a.dataset.t;document.documentElement.dataset.theme=S.theme;save();draw();toast('Theme: '+THEMES.find(t=>t[0]===S.theme)[1])}
  else if(act==='reset'){if(confirm('Reset all progress?')){S={name:S.name,done:{},stars:0,best:{},day:{d:'',n:0}};save();draw();toast('Progress reset')}}
});
draw();
</script>
</body>
</html>
